<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>五条悟 · 無量空処</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='%23000' stroke='%2300d4ff' stroke-width='4'/><circle cx='50' cy='50' r='18' fill='%239933ff'/></svg>">
<style>
/* ========== 基础重置 ========== */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --ao:#00d4ff;       /* 苍 */
  --kaku:#ff2d55;     /* 赫 */
  --murasaki:#b14aff; /* 虚式茈 */
  --gold:#c9a96e;
  --frame-dark:#1a1a2e;
  --bg-0:#050510;
  --bg-1:#0a0a1f;
  --text:#e8e8f0;
  --text-dim:#8888a0;
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg-0);color:var(--text);
  font-family:"Noto Serif SC","Songti SC","SimSun",serif;-webkit-font-smoothing:antialiased}
body{cursor:default}

/* ========== 视图切换 ========== */
.view{position:fixed;inset:0;display:none;opacity:0;transition:opacity .8s ease}
.view.active{display:flex;opacity:1}

/* ========== 背景画布 ========== */
#bgCanvas{position:fixed;inset:0;z-index:0;pointer-events:none}

/* ========== 主页 ========== */
#homeView{flex-direction:column;align-items:center;justify-content:center;z-index:1}

/* 技能画布 */
#skillCanvas{position:fixed;inset:0;z-index:2;pointer-events:none}

/* 特效图片层 */
.effect-layer{position:fixed;inset:0;z-index:3;pointer-events:none;overflow:hidden}
.orb-wrap{position:absolute;opacity:0;transition:opacity .5s ease;will-change:left,top}
.orb-wrap.show{opacity:1}
.orb-img{display:block;border-radius:50%;mix-blend-mode:screen;
  object-fit:cover;width:100%;height:100%;
  filter:brightness(1.3) contrast(1.15) saturate(1.2)}
#aoWrap{width:280px;height:280px;margin:-140px 0 0 -140px}
#aoWrap .orb-img{width:100%;height:100%;animation:orbSpin 7s linear infinite}
#kakuWrap{width:250px;height:250px;margin:-125px 0 0 -125px}
#kakuWrap .orb-img{width:100%;height:100%;animation:orbSpinRev 5.5s linear infinite}
#murasakiWrap{width:420px;height:420px;margin:-210px 0 0 -210px;
  animation:murasakiBreath 1.8s ease-in-out infinite}
#murasakiWrap .orb-img{width:100%;height:100%;animation:orbSpin 9s linear infinite}
@keyframes orbSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes orbSpinRev{from{transform:rotate(360deg)}to{transform:rotate(0deg)}}
@keyframes murasakiBreath{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}

/* ========== 无量空处层 ========== */
.void-domain{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:0;
  background:radial-gradient(ellipse at center,rgba(177,74,255,.12) 0%,transparent 70%);
  transition:opacity 1s ease;overflow:hidden}
.void-domain.active{opacity:1}
.void-grid{position:absolute;inset:0;perspective:600px}
.void-grid-inner{position:absolute;inset:-50%;
  background-image:
    linear-gradient(rgba(0,212,255,.15) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,45,85,.15) 1px,transparent 1px);
  background-size:60px 60px;
  transform:rotateX(60deg);
  animation:voidGrid 4s linear infinite}
@keyframes voidGrid{from{background-position:0 0}to{background-position:0 60px}}
.void-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:clamp(2rem,8vw,6rem);font-weight:900;letter-spacing:.3em;
  color:transparent;-webkit-text-stroke:1.5px rgba(177,74,255,.6);
  text-shadow:0 0 40px rgba(177,74,255,.4);animation:voidPulse 2s ease-in-out infinite}
@keyframes voidPulse{0%,100%{opacity:.4;transform:scale(1)}50%{opacity:.9;transform:scale(1.05)}}
.void-particles{position:absolute;inset:0}
.void-particles span{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;
  animation:voidFloat linear infinite;opacity:0}
@keyframes voidFloat{0%{transform:translateY(100vh) scale(0);opacity:0}10%{opacity:.8}
  90%{opacity:.8}100%{transform:translateY(-10vh) scale(1);opacity:0}}

/* ========== 角色卡片舞台 ========== */
.card-stage{position:relative;z-index:5;display:flex;flex-direction:column;align-items:center;gap:1.2rem;
  perspective:1200px}

/* 卡片本体 */
.card{position:relative;width:min(78vw,320px);aspect-ratio:3/4;cursor:pointer;
  transform-style:preserve-3d;transition:transform .15s ease-out;
  border-radius:14px}
.card:hover{transform:rotateY(var(--rx,0deg)) rotateX(var(--ry,0deg)) scale(1.03)!important}

/* 卡片图片 */
.card-image-wrap{position:absolute;inset:0;border-radius:14px;overflow:hidden;z-index:1;
  box-shadow:0 0 0 1px rgba(201,169,110,.4),
    inset 0 0 60px rgba(0,0,0,.25)}
.card-image{width:100%;height:100%;object-fit:cover;display:block;
  filter:contrast(1.05) saturate(1.1)}

/* 外层金属框（在图片下方，边缘露出形成边框） */
.card-frame-outer{position:absolute;inset:-7px;border-radius:18px;z-index:0;pointer-events:none;
  background:linear-gradient(135deg,#4a4a6e 0%,#1e1e38 25%,#303050 50%,#1e1e38 75%,#4a4a6e 100%);
  box-shadow:0 0 0 1px rgba(201,169,110,.35),0 10px 50px rgba(0,0,0,.8),
    inset 0 1px 0 rgba(255,255,255,.12),inset 0 -1px 0 rgba(0,0,0,.4)}

/* 内层装饰线 */
.card-frame-inner{position:absolute;inset:5px;border-radius:12px;z-index:2;pointer-events:none;
  border:1px solid rgba(201,169,110,.2)}

/* 四角装饰 */
.card-corner{position:absolute;width:28px;height:28px;z-index:3;pointer-events:none}
.card-corner::before,.card-corner::after{content:"";position:absolute;background:var(--gold);
  box-shadow:0 0 10px rgba(201,169,110,.7)}
.card-corner.tl{top:7px;left:7px}
.card-corner.tl::before{top:0;left:0;width:100%;height:2px}
.card-corner.tl::after{top:0;left:0;width:2px;height:100%}
.card-corner.tr{top:7px;right:7px}
.card-corner.tr::before{top:0;right:0;width:100%;height:2px}
.card-corner.tr::after{top:0;right:0;width:2px;height:100%}
.card-corner.bl{bottom:7px;left:7px}
.card-corner.bl::before{bottom:0;left:0;width:100%;height:2px}
.card-corner.bl::after{bottom:0;left:0;width:2px;height:100%}
.card-corner.br{bottom:7px;right:7px}
.card-corner.br::before{bottom:0;right:0;width:100%;height:2px}
.card-corner.br::after{bottom:0;right:0;width:2px;height:100%}

/* 闪卡全息光泽 */
.card-shine{position:absolute;inset:0;border-radius:14px;z-index:4;pointer-events:none;
  background:linear-gradient(
    105deg,
    transparent 30%,
    rgba(0,212,255,.15) 38%,
    rgba(177,74,255,.2) 45%,
    rgba(255,45,85,.15) 52%,
    rgba(255,255,255,.25) 56%,
    rgba(201,169,110,.15) 62%,
    transparent 70%
  );
  background-size:250% 250%;
  background-position:var(--shine-x,50%) var(--shine-y,50%);
  mix-blend-mode:screen;
  animation:shineIdle 4s ease-in-out infinite;
  opacity:.7}
@keyframes shineIdle{
  0%,100%{background-position:0% 50%}
  50%{background-position:100% 50%}
}
.card:hover .card-shine{animation:none;opacity:1}

/* 卡片底部铭牌 */
.card-label{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);z-index:5;
  text-align:center;pointer-events:none}
.label-name{display:block;font-size:1.1rem;font-weight:700;letter-spacing:.4em;
  color:var(--gold);text-shadow:0 0 12px rgba(201,169,110,.5),0 2px 4px rgba(0,0,0,.8)}
.label-title{display:block;font-size:.65rem;letter-spacing:.5em;color:var(--text-dim);
  margin-top:2px;text-shadow:0 1px 3px rgba(0,0,0,.8)}

/* 卡片能量光环 */
.card::before{content:"";position:absolute;inset:-20px;border-radius:24px;z-index:-1;
  background:radial-gradient(ellipse at center,rgba(0,212,255,.15) 0%,transparent 60%);
  animation:cardGlow 3s ease-in-out infinite alternate}
@keyframes cardGlow{from{opacity:.5}to{opacity:1}}

/* 提示文字 */
.card-hint{font-size:.75rem;letter-spacing:.4em;color:var(--text-dim);
  animation:hintBlink 2s ease-in-out infinite;z-index:5}
@keyframes hintBlink{0%,100%{opacity:.4}50%{opacity:.9}}

/* 阶段指示器 */
.phase-indicator{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);z-index:6;
  font-size:.8rem;letter-spacing:.5em;color:var(--text-dim);
  padding:.4rem 1.2rem;border:1px solid rgba(255,255,255,.1);border-radius:20px;
  background:rgba(10,10,31,.6);backdrop-filter:blur(8px)}
#phaseText{transition:color .5s,text-shadow .5s}
#phaseText.ao{color:var(--ao);text-shadow:0 0 10px rgba(0,212,255,.5)}
#phaseText.kaku{color:var(--kaku);text-shadow:0 0 10px rgba(255,45,85,.5)}
#phaseText.murasaki{color:var(--murasaki);text-shadow:0 0 10px rgba(177,74,255,.6)}
#phaseText.void{color:#fff;text-shadow:0 0 15px rgba(177,74,255,.8)}

/* ========== 视频播放页 ========== */
#videoView{flex-direction:column;align-items:center;justify-content:center;z-index:10;
  background:radial-gradient(ellipse at center,var(--bg-1) 0%,var(--bg-0) 100%)}
.video-container{position:relative;width:min(92vw,960px);z-index:11}
.video-frame{position:relative;border-radius:12px;overflow:hidden;
  box-shadow:0 0 0 1px rgba(201,169,110,.3),0 0 60px rgba(177,74,255,.2),
    0 20px 60px rgba(0,0,0,.8);
  aspect-ratio:16/9;background:#000}
.video-frame::before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;
  box-shadow:inset 0 0 80px rgba(0,0,0,.4);border-radius:12px}
#player{width:100%;height:100%;object-fit:contain;display:block}
.exit-btn{position:fixed;top:1.5rem;right:1.5rem;z-index:20;
  padding:.6rem 1.4rem;font-family:inherit;font-size:.8rem;letter-spacing:.3em;
  color:var(--text);background:rgba(10,10,31,.7);border:1px solid rgba(255,255,255,.2);
  border-radius:8px;cursor:pointer;backdrop-filter:blur(10px);
  transition:all .3s ease}
.exit-btn:hover{border-color:var(--kaku);color:var(--kaku);
  box-shadow:0 0 20px rgba(255,45,85,.3);transform:translateY(-1px)}
.exit-btn:active{transform:translateY(0)}

/* 视频页背景装饰 */
#videoView::before{content:"";position:absolute;inset:0;
  background:
    radial-gradient(circle at 20% 30%,rgba(0,212,255,.06) 0%,transparent 40%),
    radial-gradient(circle at 80% 70%,rgba(255,45,85,.06) 0%,transparent 40%);
  pointer-events:none}

/* ========== 响应式 ========== */
@media(max-width:600px){
  .card{width:min(72vw,280px)}
  .phase-indicator{bottom:1rem;font-size:.7rem;padding:.3rem .9rem}
  .exit-btn{top:1rem;right:1rem;padding:.5rem 1rem;font-size:.7rem}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important}
}
</style>
</head>
<body>

<!-- 背景粒子 -->
<canvas id="bgCanvas"></canvas>

<!-- ==================== 主页视图 ==================== -->
<section id="homeView" class="view active">
  <canvas id="skillCanvas"></canvas>

  <!-- 特效图片层 -->
  <div class="effect-layer" id="effectLayer">
    <div class="orb-wrap" id="aoWrap">
      <img src="assets/ao.jpg" alt="苍" class="orb-img ao-spin">
    </div>
    <div class="orb-wrap" id="kakuWrap">
      <img src="assets/kaku.jpg" alt="赫" class="orb-img kaku-spin">
    </div>
    <div class="orb-wrap" id="murasakiWrap">
      <img src="assets/murasaki.jpg" alt="虚式茈" class="orb-img murasaki-spin">
    </div>
  </div>

  <!-- 无量空处层 -->
  <div class="void-domain" id="voidDomain">
    <div class="void-grid"><div class="void-grid-inner"></div></div>
    <div class="void-text">無量空処</div>
    <div class="void-particles" id="voidParticles"></div>
  </div>

  <!-- 角色卡片 -->
  <div class="card-stage">
    <div class="card" id="characterCard">
      <div class="card-frame-outer"></div>
      <div class="card-frame-inner"></div>
      <div class="card-image-wrap">
        <img src="wtw.jpg" alt="五条悟" class="card-image">
      </div>
      <div class="card-corner tl"></div>
      <div class="card-corner tr"></div>
      <div class="card-corner bl"></div>
      <div class="card-corner br"></div>
      <div class="card-shine"></div>
      <div class="card-label">
        <span class="label-name">五条悟</span>
        <span class="label-title">無量空処</span>
      </div>
    </div>
    <p class="card-hint">点 击 卡 片 进 入 领 域</p>
  </div>

  <div class="phase-indicator">
    <span id="phaseText">蒼 · 赫</span>
  </div>
</section>

<!-- ==================== 视频播放视图 ==================== -->
<section id="videoView" class="view">
  <div class="video-container">
    <div class="video-frame">
      <video id="player" src="xsdj.MP4" controls playsinline preload="metadata"></video>
    </div>
  </div>
  <button class="exit-btn" id="exitBtn">退 出 领 域</button>
</section>

<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const rand=(a,b)=>a+Math.random()*(b-a);
const TAU=Math.PI*2;

/* ===== 背景粒子 ===== */
const bgCanvas=$('bgCanvas'),bgCtx=bgCanvas.getContext('2d');
let bgParticles=[];
function resizeBg(){bgCanvas.width=innerWidth;bgCanvas.height=innerHeight;}
function initBgParticles(){
  bgParticles=[];
  const n=Math.floor(innerWidth*innerHeight/12000);
  for(let i=0;i<n;i++)bgParticles.push({
    x:rand(0,innerWidth),y:rand(0,innerHeight),r:rand(.5,2),
    sp:rand(.08,.4),alpha:rand(.15,.6),hue:Math.random()>.5?200:320});
}
function drawBg(){
  bgCtx.clearRect(0,0,bgCanvas.width,bgCanvas.height);
  for(const p of bgParticles){
    p.y-=p.sp;if(p.y<-5){p.y=innerHeight+5;p.x=rand(0,innerWidth);}
    bgCtx.beginPath();bgCtx.arc(p.x,p.y,p.r,0,TAU);
    bgCtx.fillStyle=`hsla(${p.hue},80%,70%,${p.alpha})`;bgCtx.fill();
  }
}

/* ===== 技能画布 ===== */
const skCanvas=$('skillCanvas'),skCtx=skCanvas.getContext('2d');
function resizeSk(){skCanvas.width=innerWidth;skCanvas.height=innerHeight;}
resizeSk();resizeBg();initBgParticles();
addEventListener('resize',()=>{resizeSk();resizeBg();initBgParticles();});

/* 能量球粒子 */
let orbParticles=[];
function spawnOrbParticle(x,y,color,count,speed){
  for(let i=0;i<count;i++){
    const a=rand(0,TAU),s=rand(speed*.3,speed);
    orbParticles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,
      life:1,decay:rand(.005,.014),r:rand(1.5,4.5),color});
  }
}

/* 绘制苍 —— 蓝色螺旋漩涡 */
function drawAo(x,y,r,t){
  // 外层光晕
  const g0=skCtx.createRadialGradient(x,y,0,x,y,r*6.5);
  g0.addColorStop(0,'rgba(0,160,255,.35)');
  g0.addColorStop(0.3,'rgba(0,100,255,.15)');
  g0.addColorStop(1,'transparent');
  skCtx.fillStyle=g0;skCtx.beginPath();skCtx.arc(x,y,r*6.5,0,TAU);skCtx.fill();
  // 多层螺旋线
  for(let layer=0;layer<5;layer++){
    const baseR=r*(0.4+layer*0.32);
    const speed=0.0022*(layer%2===0?1:-1)*(1+layer*0.25);
    const offset=t*speed+layer*0.5;
    skCtx.strokeStyle=`rgba(0,190,255,${0.75-layer*0.11})`;
    skCtx.lineWidth=3.2-layer*0.45;
    skCtx.beginPath();
    for(let a=0;a<TAU*1.6;a+=0.08){
      const rr=baseR+a*r*0.14;
      const px=x+Math.cos(a+offset)*rr;
      const py=y+Math.sin(a+offset)*rr*0.88;
      if(a===0)skCtx.moveTo(px,py);else skCtx.lineTo(px,py);
    }
    skCtx.stroke();
  }
  // 旋转能量环
  for(let i=0;i<3;i++){
    const aa=t*0.0016*(i%2?1:-1)+i*TAU/3;
    const rr=r*(2.1+i*0.6);
    skCtx.strokeStyle=`rgba(100,220,255,${0.65-i*0.15})`;
    skCtx.lineWidth=2.8;
    skCtx.beginPath();skCtx.arc(x,y,rr,aa,aa+2.3);skCtx.stroke();
    const hx=x+Math.cos(aa+2.3)*rr,hy=y+Math.sin(aa+2.3)*rr;
    skCtx.fillStyle='#fff';skCtx.beginPath();skCtx.arc(hx,hy,3.5,0,TAU);skCtx.fill();
  }
  // 中心深色漩涡
  const gc=skCtx.createRadialGradient(x,y,0,x,y,r*1.25);
  gc.addColorStop(0,'#000820');gc.addColorStop(0.45,'#001a4a');
  gc.addColorStop(0.8,'#003388');gc.addColorStop(1,'transparent');
  skCtx.fillStyle=gc;skCtx.beginPath();skCtx.arc(x,y,r*1.25,0,TAU);skCtx.fill();
  // 中心亮点
  skCtx.fillStyle='rgba(160,235,255,.95)';
  skCtx.beginPath();skCtx.arc(x,y,r*0.28,0,TAU);skCtx.fill();
  // 蓝色闪电
  skCtx.lineWidth=1.8;
  for(let i=0;i<5;i++){
    const aa=t*0.003+i*TAU/5+Math.sin(t*0.005+i)*0.5;
    const len=r*(2.8+Math.random()*2.2);
    let px=x,py=y;
    skCtx.strokeStyle=`rgba(130,225,255,${.7+Math.random()*.3})`;
    skCtx.beginPath();skCtx.moveTo(px,py);
    for(let j=0;j<5;j++){
      px+=Math.cos(aa+(Math.random()-.5)*1.3)*len/5;
      py+=Math.sin(aa+(Math.random()-.5)*1.3)*len/5;
      skCtx.lineTo(px,py);
    }
    skCtx.stroke();
  }
}

/* 绘制赫 —— 红色破坏球 */
function drawKaku(x,y,r,t){
  // 外层光晕
  const g0=skCtx.createRadialGradient(x,y,0,x,y,r*6);
  g0.addColorStop(0,'rgba(255,50,80,.4)');
  g0.addColorStop(0.3,'rgba(255,30,60,.15)');
  g0.addColorStop(1,'transparent');
  skCtx.fillStyle=g0;skCtx.beginPath();skCtx.arc(x,y,r*6,0,TAU);skCtx.fill();
  // 红色能量尖刺
  for(let i=0;i<9;i++){
    const aa=t*0.0009+i*TAU/9+Math.sin(t*0.003+i)*0.3;
    const innerR=r*0.85;
    const outerR=r*(1.9+Math.sin(t*0.004+i*2)*0.45);
    const tipX=x+Math.cos(aa)*outerR,tipY=y+Math.sin(aa)*outerR;
    const b1x=x+Math.cos(aa+0.28)*innerR,b1y=y+Math.sin(aa+0.28)*innerR;
    const b2x=x+Math.cos(aa-0.28)*innerR,b2y=y+Math.sin(aa-0.28)*innerR;
    const grad=skCtx.createLinearGradient(x,y,tipX,tipY);
    grad.addColorStop(0,'rgba(255,90,110,.95)');
    grad.addColorStop(1,'rgba(255,30,60,0)');
    skCtx.fillStyle=grad;
    skCtx.beginPath();skCtx.moveTo(b1x,b1y);skCtx.lineTo(tipX,tipY);
    skCtx.lineTo(b2x,b2y);skCtx.closePath();skCtx.fill();
  }
  // 球体核心
  const gc=skCtx.createRadialGradient(x-r*0.3,y-r*0.35,0,x,y,r);
  gc.addColorStop(0,'#ff99aa');gc.addColorStop(0.25,'#ff4466');
  gc.addColorStop(0.65,'#cc1133');gc.addColorStop(1,'#770018');
  skCtx.fillStyle=gc;skCtx.beginPath();skCtx.arc(x,y,r,0,TAU);skCtx.fill();
  // 表面裂纹
  skCtx.strokeStyle='rgba(255,210,120,.75)';skCtx.lineWidth=1.3;
  for(let i=0;i<7;i++){
    const aa=i*TAU/7+t*0.0004;
    let px=x+Math.cos(aa)*r*0.15,py=y+Math.sin(aa)*r*0.15;
    skCtx.beginPath();skCtx.moveTo(px,py);
    for(let j=1;j<=4;j++){
      const rr=r*(0.15+0.7*j/4);
      const na=aa+(Math.random()-.5)*0.7;
      px=x+Math.cos(na)*rr;py=y+Math.sin(na)*rr;
      skCtx.lineTo(px,py);
    }
    skCtx.stroke();
  }
  // 高光
  skCtx.fillStyle='rgba(255,210,210,.55)';
  skCtx.beginPath();skCtx.ellipse(x-r*0.35,y-r*0.42,r*0.26,r*0.16,-0.5,0,TAU);skCtx.fill();
  // 红色闪电
  skCtx.lineWidth=1.6;
  for(let i=0;i<4;i++){
    const aa=t*0.0026+i*TAU/4+Math.sin(t*0.004+i)*0.6;
    const len=r*(2.2+Math.random()*1.8);
    let px=x,py=y;
    skCtx.strokeStyle=`rgba(255,160,170,${.65+Math.random()*.3})`;
    skCtx.beginPath();skCtx.moveTo(px,py);
    for(let j=0;j<4;j++){
      px+=Math.cos(aa+(Math.random()-.5)*1.1)*len/4;
      py+=Math.sin(aa+(Math.random()-.5)*1.1)*len/4;
      skCtx.lineTo(px,py);
    }
    skCtx.stroke();
  }
}

/* 绘制虚式茈 —— 蓝紫交织狂暴漩涡 */
function drawMurasaki(x,y,r,t){
  // 巨大光晕
  const g0=skCtx.createRadialGradient(x,y,0,x,y,r*7.5);
  g0.addColorStop(0,'rgba(177,74,255,.42)');
  g0.addColorStop(0.2,'rgba(120,40,200,.2)');
  g0.addColorStop(0.5,'rgba(60,20,120,.08)');
  g0.addColorStop(1,'transparent');
  skCtx.fillStyle=g0;skCtx.beginPath();skCtx.arc(x,y,r*7.5,0,TAU);skCtx.fill();
  // 蓝紫双螺旋
  for(let layer=0;layer<6;layer++){
    const baseR=r*(0.35+layer*0.3);
    const speed=0.0028*(layer%2===0?1:-1)*(1+layer*0.2);
    const offset=t*speed+layer*0.4;
    const isBlue=layer%2===0;
    skCtx.strokeStyle=isBlue?`rgba(0,210,255,${0.65-layer*0.08})`:`rgba(190,90,255,${0.65-layer*0.08})`;
    skCtx.lineWidth=3.8-layer*0.45;
    skCtx.beginPath();
    for(let a=0;a<TAU*1.8;a+=0.07){
      const rr=baseR+a*r*0.13;
      const px=x+Math.cos(a+offset)*rr;
      const py=y+Math.sin(a+offset)*rr*0.85;
      if(a===0)skCtx.moveTo(px,py);else skCtx.lineTo(px,py);
    }
    skCtx.stroke();
  }
  // 能量环
  for(let i=0;i<4;i++){
    const aa=t*0.0022*(i%2?1:-1)+i*TAU/4;
    const rr=r*(2+i*0.55);
    skCtx.strokeStyle=`rgba(210,140,255,${0.55-i*0.1})`;
    skCtx.lineWidth=3.2;
    skCtx.beginPath();skCtx.arc(x,y,rr,aa,aa+2.6);skCtx.stroke();
  }
  // 中心
  const gc=skCtx.createRadialGradient(x,y,0,x,y,r*1.4);
  gc.addColorStop(0,'#fff');gc.addColorStop(0.18,'#e0b0ff');
  gc.addColorStop(0.45,'#9933ff');gc.addColorStop(0.75,'#3300aa');
  gc.addColorStop(1,'transparent');
  skCtx.fillStyle=gc;skCtx.beginPath();skCtx.arc(x,y,r*1.4,0,TAU);skCtx.fill();
  // 狂暴闪电（蓝紫交替）
  for(let i=0;i<9;i++){
    const aa=t*0.0035+i*TAU/9+Math.sin(t*0.006+i)*0.7;
    const len=r*(3.2+Math.random()*2.8);
    let px=x,py=y;
    skCtx.strokeStyle=Math.random()>.5?'rgba(130,225,255,.95)':'rgba(210,140,255,.95)';
    skCtx.lineWidth=2.2;
    skCtx.beginPath();skCtx.moveTo(px,py);
    for(let j=0;j<6;j++){
      px+=Math.cos(aa+(Math.random()-.5)*1.5)*len/6;
      py+=Math.sin(aa+(Math.random()-.5)*1.5)*len/6;
      skCtx.lineTo(px,py);
    }
    skCtx.stroke();
  }
}

/* 冲击波 */
let shockwaves=[];
function spawnShockwave(x,y,color,w){
  shockwaves.push({x,y,r:8,maxR:Math.max(innerWidth,innerHeight)*.85,
    alpha:1,color,width:w||5});
}

/* ===== 状态机 ===== */
const PHASE={ORBIT:'orbit',CONVERGE:'converge',HOLLOW:'hollow',VOID:'void'};
const DURATION={ORBIT:6000,CONVERGE:1400,HOLLOW:2500,VOID:5000};
let phase=PHASE.ORBIT,phaseStart=performance.now();
let aoAngle=0,kakuAngle=Math.PI;
const phaseText=$('phaseText'),voidDomain=$('voidDomain'),card=$('characterCard');

function getCardCenter(){
  const r=card.getBoundingClientRect();
  return{x:r.left+r.width/2,y:r.top+r.height/2};
}
function setPhase(p){
  phase=p;phaseStart=performance.now();
  if(p===PHASE.ORBIT){phaseText.textContent='蒼 · 赫';phaseText.className='ao';voidDomain.classList.remove('active');}
  else if(p===PHASE.CONVERGE){phaseText.textContent='合 成';phaseText.className='murasaki';}
  else if(p===PHASE.HOLLOW){phaseText.textContent='虚 式 茈';phaseText.className='murasaki';}
  else if(p===PHASE.VOID){phaseText.textContent='無量空処';phaseText.className='void';voidDomain.classList.add('active');}
}

/* 无量空处粒子 */
const voidParticlesEl=$('voidParticles');
function initVoidParticles(){
  voidParticlesEl.innerHTML='';
  for(let i=0;i<60;i++){
    const s=document.createElement('span');
    s.style.left=rand(0,100)+'%';
    s.style.animationDuration=rand(1.5,4)+'s';
    s.style.animationDelay=rand(0,3)+'s';
    const sz=rand(1,4);s.style.width=s.style.height=sz+'px';
    voidParticlesEl.appendChild(s);
  }
}
initVoidParticles();

/* ===== 主动画 ===== */
let lastT=performance.now();
function loop(now){
  const dt=now-lastT;lastT=now;
  const elapsed=now-phaseStart;
  drawBg();
  skCtx.clearRect(0,0,skCanvas.width,skCanvas.height);
  const center=getCardCenter();
  const orbitR=Math.min(innerWidth,innerHeight)*0.36;

  /* 粒子更新 */
  for(let i=orbParticles.length-1;i>=0;i--){
    const p=orbParticles[i];
    p.x+=p.vx;p.y+=p.vy;p.vx*=.965;p.vy*=.965;p.life-=p.decay;
    if(p.life<=0){orbParticles.splice(i,1);continue;}
    skCtx.beginPath();skCtx.arc(p.x,p.y,p.r*p.life,0,TAU);
    skCtx.fillStyle=p.color+Math.floor(p.life*255).toString(16).padStart(2,'0');
    skCtx.fill();
  }
  /* 冲击波 */
  for(let i=shockwaves.length-1;i>=0;i--){
    const w=shockwaves[i];
    w.r+=(w.maxR-w.r)*.035;w.alpha-=.01;
    if(w.alpha<=0){shockwaves.splice(i,1);continue;}
    skCtx.beginPath();skCtx.arc(w.x,w.y,w.r,0,TAU);
    skCtx.strokeStyle=w.color+Math.floor(w.alpha*255).toString(16).padStart(2,'0');
    skCtx.lineWidth=w.width*w.alpha;skCtx.stroke();
  }

  const aoWrap=$('aoWrap'),kakuWrap=$('kakuWrap'),murasakiWrap=$('murasakiWrap');

  if(phase===PHASE.ORBIT){
    aoAngle+=dt*.00055;kakuAngle-=dt*.00055;
    const ax=center.x+Math.cos(aoAngle)*orbitR;
    const ay=center.y+Math.sin(aoAngle)*orbitR*.72;
    const kx=center.x+Math.cos(kakuAngle)*orbitR;
    const ky=center.y+Math.sin(kakuAngle)*orbitR*.72;
    aoWrap.style.left=ax+'px';aoWrap.style.top=ay+'px';
    kakuWrap.style.left=kx+'px';kakuWrap.style.top=ky+'px';
    aoWrap.classList.add('show');kakuWrap.classList.add('show');
    murasakiWrap.classList.remove('show');
    if(Math.random()<.35)spawnOrbParticle(ax,ay,'#00d4ff',1,1.5);
    if(Math.random()<.35)spawnOrbParticle(kx,ky,'#ff2d55',1,1.5);
    if(elapsed>=DURATION.ORBIT)setPhase(PHASE.CONVERGE);
  }
  else if(phase===PHASE.CONVERGE){
    const t=Math.min(elapsed/DURATION.CONVERGE,1);
    const ease=t*t*(3-2*t);
    aoAngle+=dt*.00055*(1-t);kakuAngle-=dt*.00055*(1-t);
    const ax=center.x+Math.cos(aoAngle)*orbitR*(1-ease);
    const ay=center.y+Math.sin(aoAngle)*orbitR*.72*(1-ease);
    const kx=center.x+Math.cos(kakuAngle)*orbitR*(1-ease);
    const ky=center.y+Math.sin(kakuAngle)*orbitR*.72*(1-ease);
    aoWrap.style.left=ax+'px';aoWrap.style.top=ay+'px';
    kakuWrap.style.left=kx+'px';kakuWrap.style.top=ky+'px';
    if(Math.random()<.6)spawnOrbParticle(ax,ay,'#00d4ff',2,2);
    if(Math.random()<.6)spawnOrbParticle(kx,ky,'#ff2d55',2,2);
    if(t>.25){
      skCtx.strokeStyle='rgba(177,74,255,'+(t-.2)*1.2+')';
      skCtx.lineWidth=3+t*6;
      let mx=ax,my=ay;skCtx.beginPath();skCtx.moveTo(mx,my);
      for(let s=1;s<=6;s++){
        const pp=s/6;
        mx=ax+(kx-ax)*pp+(Math.random()-.5)*30*t;
        my=ay+(ky-ay)*pp+(Math.random()-.5)*30*t;
        skCtx.lineTo(mx,my);
      }
      skCtx.stroke();
    }
    if(elapsed>=DURATION.CONVERGE){
      setPhase(PHASE.HOLLOW);
      aoWrap.classList.remove('show');kakuWrap.classList.remove('show');
      murasakiWrap.style.left=center.x+'px';murasakiWrap.style.top=center.y+'px';
      murasakiWrap.classList.add('show');
      spawnShockwave(center.x,center.y,'#b14aff',6);
      spawnShockwave(center.x,center.y,'#00d4ff',4);
      spawnShockwave(center.x,center.y,'#ff2d55',4);
      spawnOrbParticle(center.x,center.y,'#b14aff',80,7);
      spawnOrbParticle(center.x,center.y,'#00d4ff',40,5);
      spawnOrbParticle(center.x,center.y,'#ff2d55',40,5);
      spawnOrbParticle(center.x,center.y,'#ffffff',20,8);
    }
  }
  else if(phase===PHASE.HOLLOW){
    murasakiWrap.style.left=center.x+'px';murasakiWrap.style.top=center.y+'px';
    if(Math.random()<.7)spawnOrbParticle(center.x,center.y,'#b14aff',3,4);
    if(Math.random()<.3)spawnOrbParticle(center.x,center.y,'#ffffff',2,6);
    if(elapsed>=DURATION.HOLLOW)setPhase(PHASE.VOID);
  }
  else if(phase===PHASE.VOID){
    murasakiWrap.classList.remove('show');
    if(elapsed<1000&&Math.random()<.5)
      spawnOrbParticle(center.x+rand(-40,40),center.y+rand(-40,40),'#b14aff',2,3);
    if(elapsed>=DURATION.VOID){
      setPhase(PHASE.ORBIT);
      aoAngle=rand(0,TAU);kakuAngle=aoAngle+Math.PI;
    }
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ===== 卡片3D倾斜 ===== */
let cardRect=null;
function updateCardRect(){cardRect=card.getBoundingClientRect();}
updateCardRect();addEventListener('resize',updateCardRect);
card.addEventListener('mousemove',e=>{
  if(!cardRect)updateCardRect();
  const x=(e.clientX-cardRect.left)/cardRect.width-.5;
  const y=(e.clientY-cardRect.top)/cardRect.height-.5;
  card.style.setProperty('--rx',(x*12)+'deg');
  card.style.setProperty('--ry',(-y*12)+'deg');
  card.style.setProperty('--shine-x',((x+.5)*100)+'%');
  card.style.setProperty('--shine-y',((y+.5)*100)+'%');
});
card.addEventListener('mouseleave',()=>{
  card.style.setProperty('--rx','0deg');card.style.setProperty('--ry','0deg');
});
card.addEventListener('touchmove',e=>{
  const t=e.touches[0];if(!cardRect)updateCardRect();
  const x=(t.clientX-cardRect.left)/cardRect.width-.5;
  const y=(t.clientY-cardRect.top)/cardRect.height-.5;
  card.style.setProperty('--rx',(x*10)+'deg');
  card.style.setProperty('--ry',(-y*10)+'deg');
  card.style.setProperty('--shine-x',((x+.5)*100)+'%');
},{passive:true});

/* ===== 页面切换 ===== */
const homeView=$('homeView'),videoView=$('videoView'),player=$('player'),exitBtn=$('exitBtn');
card.addEventListener('click',()=>{
  homeView.classList.remove('active');videoView.classList.add('active');
  player.currentTime=0;player.play().catch(()=>{});
});
exitBtn.addEventListener('click',()=>{
  player.pause();videoView.classList.remove('active');homeView.classList.add('active');
  updateCardRect();
});
addEventListener('keydown',e=>{
  if(e.key==='Escape'&&videoView.classList.contains('active'))exitBtn.click();
});
})();
</script>
